<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gestão · Araújo & Castro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- enquanto confere se já existe sessão aberta -->
<div id="tela-carregando" class="carregando" style="padding-top:30vh">Carregando…</div>

<!-- LOGIN -->
<section id="tela-login" class="escondido">
  <form class="login-caixa" id="form-login" autocomplete="on">
    <div class="login-topo">
      <div class="marca"><div class="marca-sig">A&amp;C</div>
        <div><div class="marca-nome">Araújo &amp; Castro</div><div class="marca-sub">Sistema do escritório</div></div></div>
    </div>
    <div class="login-corpo">
      <label class="campo">E-mail<input type="email" id="login-email" required autocomplete="username"></label>
      <label class="campo">Senha<input type="password" id="login-senha" required autocomplete="current-password"></label>
      <div id="login-msg"></div>
      <button class="btn btn-p" type="submit" id="login-btn" style="justify-content:center">Entrar</button>
    </div>
  </form>
</section>

<!-- SISTEMA -->
<section id="tela-app" class="escondido">
  <header id="hd">
    <div class="marca"><div class="marca-sig">A&amp;C</div>
      <div><div class="marca-nome">Araújo &amp; Castro</div><div class="marca-sub">Gestão</div></div></div>
    <nav id="menu">
      <a href="index.html" class="menu-voltar">← Voltar ao ERP</a>
      <button data-tela="inicio">Início</button>
      <button data-tela="painel">Painel Executivo</button>
      <button data-tela="juridico">Honorários Jurídico</button>
      <button data-tela="contabilidade">Honorários Contabilidade</button>
      <button data-tela="contratos">Contratos</button>
      <button data-tela="clientes">Clientes</button>
      <button data-tela="alertas">Alertas</button>
      <button data-tela="admin" class="so-admin">Administração</button>
    </nav>
    <div class="hd-usuario"><span id="hd-nome"></span><button id="btn-sair" type="button">Sair</button></div>
  </header>
  <main id="conteudo"></main>
  <footer id="rodape-gravacao" class="rodape"></footer>
</section>

<div id="janelas"></div>
<div id="aviso"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="importador.js"></script>
<script src="nucleo.js"></script>

<script src="telas-acordos.js"></script>
<script src="telas-alertas.js"></script>
<script src="atualizacoes-dados.js"></script>
<script src="telas-atualizacoes.js"></script>
<script src="telas-automacoes.js"></script>

</body>
