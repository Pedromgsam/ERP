<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM · Araújo &amp; Castro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   Tema Araújo & Castro — os mesmos tokens do ERP, para que as
   duas telas pareçam o mesmo sistema. Se um dia mudar a cor lá,
   mude aqui também: são dois arquivos, um padrão só.
   ══════════════════════════════════════════════════════════════ */
:root{
  --ac-navy:#1B2A4A;--ac-navy2:#243659;
  --ac-gold:#C9A84C;--ac-gold2:#D4A84B;--ac-gold-lt:#F5EDD6;
  --navy:var(--ac-navy); --navy2:var(--ac-navy2);
  --gold:var(--ac-gold); --gold2:var(--ac-gold2); --gold-lt:var(--ac-gold-lt);

  --blue:#2563EB;--blue-d:#1D4ED8;--blue-lt:#DBEAFE;
  --violet:#7C3AED;--violet-lt:#EDE9FE;
  --teal:#0D9488;--teal-lt:#CCFBF1;
  --red:#DC2626;--red-d:#B91C1C;--red-lt:#FEE2E2;
  --amber:#D97706;--amber-lt:#FEF3C7;
  --green:#16A34A;--green-d:#15803D;--green-lt:#DCFCE7;
  --gray:#6B7280;--gray-lt:#EEF0F5;--gray-mid:#E4E7EF;

  --border:rgba(0,0,0,.09);--border-strong:rgba(0,0,0,.16);
  --text:#1B2A4A;--text2:#374151;--text3:#6B7280;--text4:#9CA3AF;
  --bg:#F0F2F7;--white:#FFFFFF;

  --card-r:14px;--card-r-sm:10px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.10);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);

  --font-d:'Playfair Display',Georgia,serif;
  --font-b:'DM Sans','Inter',system-ui,sans-serif;
  --font-m:'JetBrains Mono','Courier New',monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --hh:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);line-height:1.5}
button{font-family:var(--font-b);cursor:pointer;border:none;background:none}
select,input,textarea{font-family:var(--font-b);font-size:inherit;color:inherit}
img{display:block}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}

/* ══ CABEÇALHO — mesma barra do ERP ══ */
#hd{position:sticky;top:0;z-index:300;height:var(--hh);
  background:var(--ac-navy);display:flex;align-items:center;gap:12px;
  padding:0 18px;
  box-shadow:0 1px 0 rgba(201,168,76,.25),0 4px 24px rgba(0,0,0,.35)}
.hd-logo{width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(145deg,var(--ac-gold),var(--ac-gold2));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);color:var(--ac-navy);font-size:13px;font-weight:800;
  letter-spacing:-.5px;box-shadow:0 3px 14px rgba(201,168,76,.55)}
.hd-brand{display:flex;flex-direction:column;justify-content:center;gap:1px}
.hd-nm{font-family:var(--font-d);color:#fff;font-size:13px;font-weight:700;line-height:1.2}
.hd-sub{font-size:8.5px;color:var(--ac-gold2);letter-spacing:.07em;text-transform:uppercase;opacity:.9}
.hd-sp{flex:1}
.hd-b{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;
  padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:500;transition:background .14s}
.hd-b:hover{background:rgba(255,255,255,.2)}
.hd-u{font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap}
.st{font-size:10.5px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);
  color:rgba(255,255,255,.85);font-family:var(--font-m);white-space:nowrap}
.st.ok{background:rgba(22,163,74,.3)} .st.err{background:rgba(220,38,38,.34)}
.st.load{background:rgba(217,119,6,.32)}

.wrap{max-width:1560px;margin:0 auto;padding:20px}

/* ══ ABAS ══ */
.tabs{display:flex;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:8px 17px;border-radius:8px 8px 0 0;font-size:12.5px;font-weight:600;
  color:var(--text4);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab:hover{background:var(--gray-lt)}
.tab.on{color:var(--navy);border-bottom-color:var(--ac-gold);background:var(--white)}
.pane{display:none} .pane.on{display:block}

/* ══ KPIs — cartão do ERP ══ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:var(--card-r-sm);
  padding:13px 16px;box-shadow:var(--shadow);border-left:3px solid var(--ac-gold)}
.kpi-l{font-size:9.5px;color:var(--text4);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.kpi-v{font-family:var(--font-m);font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi-s{font-size:11px;color:var(--text3);margin-top:2px}
.kpi.alerta{border-left-color:var(--red)} .kpi.alerta .kpi-v{color:var(--red-d)}

/* ══ FUNIL — kanban igual ao do ERP ══ */
.crm-funnel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);
  gap:12px;overflow-x:auto;padding-bottom:10px}
.crm-col{background:var(--gray-lt);border-radius:var(--card-r-sm);padding:10px;
  border:1.5px dashed var(--border-strong);min-height:110px}
.crm-col-hd{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text4);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.crm-col-dot{width:8px;height:8px;border-radius:50%;flex:none}
.crm-col-nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crm-col-cnt{font-size:10px;background:var(--white);border:1px solid var(--border);
  border-radius:20px;padding:1px 7px;color:var(--text3)}
.crm-col-val{font-family:var(--font-m);font-size:10px;color:var(--green-d);
  font-weight:700;margin-bottom:7px;padding-left:2px}
.crm-lead{background:var(--white);border:1px solid var(--border);border-radius:var(--card-r-sm);
  padding:11px 13px;margin-bottom:8px;font-size:12px;transition:all .16s var(--ease);
  position:relative;border-left:3px solid transparent}
.crm-lead:hover{box-shadow:0 3px 12px rgba(0,0,0,.1);border-color:rgba(27,42,74,.2);transform:translateY(-1px)}
.crm-lead.atrasado{border-left-color:var(--red)}
.crm-lead.hoje{border-left-color:var(--amber)}
.crm-lead-nm{font-weight:700;color:var(--navy);font-size:13px;line-height:1.25;
  cursor:pointer;padding-right:52px}
.crm-lead-nm:hover{color:var(--gold)}
.crm-lead-sub{font-size:10.5px;color:var(--text3);margin-top:3px}
.crm-lead-val{font-family:var(--font-m);font-size:11px;color:var(--green-d);font-weight:700;margin-top:4px}
.crm-lead-dt{font-size:10px;color:var(--text3);margin-top:2px}
.crm-lead-dt.atrasado{color:var(--red-d);font-weight:700}
.crm-lead-dt.hoje{color:var(--amber);font-weight:700}
.crm-card-btns{position:absolute;right:8px;top:8px;display:flex;gap:3px}
.crm-card-btn{font-size:11px;line-height:1;padding:3px 5px;border-radius:5px;
  color:var(--text4);transition:all .12s}
.crm-card-btn:hover{background:var(--navy);color:var(--ac-gold)}
.crm-acts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.mini{font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);
  background:var(--white);color:var(--text2);font-weight:600;transition:all .12s}
.mini:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.crm-vazio{font-size:11px;color:var(--text4);padding:8px 2px;text-align:center}

/* ══ TABELAS ══ */
.tw{background:var(--white);border:1px solid var(--border);border-radius:var(--card-r-sm);
  overflow:auto;box-shadow:var(--shadow);max-height:66vh}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--gray-mid);color:var(--text4);text-align:left;padding:9px 11px;
  font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;
  position:sticky;top:0;z-index:2;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:var(--gray-lt)}
.num{text-align:right;font-family:var(--font-m);white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.vazio{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}

/* ══ FORMULÁRIOS ══ */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.in{padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--white);
  font-size:12.5px;min-width:0;outline:none;transition:border-color .14s,box-shadow .14s}
.in:focus{border-color:var(--ac-gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
.btn{background:var(--navy);color:#fff;padding:8px 16px;border-radius:8px;
  font-size:12.5px;font-weight:600;transition:background .14s}
.btn:hover{background:var(--navy2)}
.btn.g{background:var(--green-d)} .btn.g:hover{background:#12833b}
.btn.o{background:var(--white);color:var(--text2);border:1px solid var(--border)}
.btn.o:hover{background:var(--gray-lt)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.fg .in{width:100%}
.req::after{content:' *';color:var(--red)}

/* ══ MODAIS ══ */
.ov{position:fixed;inset:0;background:rgba(10,18,35,.65);display:none;align-items:flex-start;
  justify-content:center;z-index:9000;padding:24px 16px;overflow-y:auto;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov.on{display:flex}
.box{background:var(--white);border-radius:16px;width:100%;max-width:660px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--border);margin:auto}
.box-hd{display:flex;align-items:center;padding:16px 22px 13px;border-bottom:2px solid var(--gold-lt);gap:10px}
.box-t{font-family:var(--font-d);font-size:16px;font-weight:700;color:var(--navy);flex:1}
.box-x{width:28px;height:28px;border-radius:50%;background:var(--gray-lt);color:var(--text3);
  font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .14s}
.box-x:hover{background:var(--red-lt);color:var(--red-d)}
.box-b{padding:18px 22px}
.box-f{padding:13px 22px;border-top:1px solid var(--border);display:flex;gap:8px;
  justify-content:flex-end;flex-wrap:wrap}

/* ══ AVISOS ══ */
.msg{border-radius:var(--card-r-sm);padding:10px 14px;font-size:12px;line-height:1.45;
  margin-bottom:12px;display:flex;gap:8px;border-left:4px solid transparent}
.msg.e{background:var(--red-lt);border-left-color:var(--red);color:#991B1B}
.msg.o{background:var(--green-lt);border-left-color:var(--green);color:#166534}
.msg.a{background:var(--amber-lt);border-left-color:var(--amber);color:#92400E}
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--navy);color:#fff;
  padding:11px 16px;border-radius:10px;font-size:12.5px;max-width:340px;line-height:1.4;
  box-shadow:var(--shadow-lg);transform:translateY(12px) scale(.97);opacity:0;
  transition:all .22s var(--ease);pointer-events:none}
#toast.show{transform:none;opacity:1}

/* linha do tempo da ficha */
.tl{border-left:2px solid var(--border);margin-left:7px;padding-left:16px;margin-top:4px}
.tl-i{position:relative;padding-bottom:14px}
.tl-i::before{content:'';position:absolute;left:-22px;top:4px;width:9px;height:9px;
  border-radius:50%;background:var(--ac-gold);border:2px solid var(--white)}
.tl-d{font-size:10.5px;color:var(--text4)}
.tl-r{font-size:12.5px;margin-top:2px;color:var(--text2);line-height:1.45}

/* ══ LOGIN — cópia da tela do ERP ══ */
#ac-login-overlay{display:none;position:fixed;inset:0;z-index:99999;background:var(--bg);
  align-items:center;justify-content:center;font-family:var(--font-b);overflow-y:auto;padding:20px}
#ac-login-overlay.open{display:flex}
.ac-login-wrap{width:100%;max-width:420px;margin:auto}
.ac-login-logo{width:140px;height:140px;border-radius:20px;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ac-login-brand{text-align:center;margin-bottom:28px}
.ac-login-brand-nm{font-family:var(--font-d);font-size:19px;font-weight:700;
  color:var(--navy);letter-spacing:-.01em;margin-top:2px}
.ac-login-brand-sub{font-size:10.5px;color:var(--text4);margin-top:4px;
  letter-spacing:.06em;text-transform:uppercase}
.ac-login-card{background:var(--white);border-radius:16px;padding:28px 28px 24px;
  border:1px solid var(--border);box-shadow:var(--shadow-md)}
.ac-login-field{margin-bottom:14px}
.ac-login-label{display:block;font-size:9px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.ac-login-input{width:100%;background:var(--gray-lt);border:1.5px solid var(--border);
  color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;
  transition:border-color .14s,box-shadow .14s;font-family:var(--font-b)}
.ac-login-input:focus{border-color:var(--ac-gold);background:var(--white);
  box-shadow:0 0 0 3px rgba(201,168,76,.15)}
.ac-login-pass-wrap{position:relative}
.ac-login-pass-wrap .ac-login-input{padding-right:40px}
.ac-login-pass-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--text4);font-size:14px;padding:3px;line-height:1;transition:color .12s}
.ac-login-pass-toggle:hover{color:var(--navy)}
.ac-login-url-wrap{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.ac-login-url-toggle{font-size:10px;color:var(--text3);cursor:pointer;letter-spacing:.04em;
  text-transform:uppercase;user-select:none;display:flex;align-items:center;
  justify-content:center;gap:4px}
.ac-login-url-toggle:hover{color:var(--navy)}
.ac-login-url-field{display:none;margin-top:8px}
.ac-login-url-field.open{display:block}
.ac-login-url-in{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 10px;
  font-size:11px;font-family:var(--font-m);color:var(--text);background:var(--white);
  outline:none;transition:border .15s}
.ac-login-url-in:focus{border-color:var(--navy)}
.ac-login-url-save{width:100%;margin-top:6px;padding:6px;background:var(--gray-lt);
  border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--text3);
  font-family:var(--font-b);transition:all .15s}
.ac-login-url-save:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.ac-login-msg{margin-bottom:12px}
.ac-login-msg-inner{background:#FEF2F2;border:1px solid rgba(185,28,28,.2);
  border-left:3px solid var(--red);border-radius:var(--card-r-sm);padding:9px 12px;
  font-size:12px;color:#B91C1C;line-height:1.5}
.ac-login-msg-ok{background:#F0FDF4;border:1px solid rgba(21,128,61,.2);
  border-left:3px solid var(--green);border-radius:var(--card-r-sm);padding:9px 12px;
  font-size:12px;color:#166534;line-height:1.5}
.ac-login-btn{width:100%;background:var(--navy);color:#fff;border-radius:var(--card-r-sm);
  padding:12px;font-size:14px;font-weight:600;transition:background .16s,box-shadow .16s;
  letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px}
.ac-login-btn:hover:not(:disabled){background:#243659;box-shadow:0 4px 18px rgba(27,42,74,.38)}
.ac-login-btn:disabled{opacity:.6;cursor:not-allowed}
.ac-login-btn2{width:100%;margin-top:8px;background:var(--gray-lt);border:1px solid var(--border);
  color:var(--text3);padding:8px;border-radius:var(--card-r-sm);font-size:11.5px;transition:all .15s}
.ac-login-btn2:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.ac-login-footer{text-align:center;margin-top:18px;font-size:10.5px;color:var(--text4);line-height:1.7}
.ac-login-spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:ac-spin .7s linear infinite;display:inline-block}
@keyframes ac-spin{to{transform:rotate(360deg)}}

@media(max-width:700px){.wrap{padding:13px}#hd{padding:0 12px}.hd-u,.hd-brand{display:none}}
</style>
</head>
<body>

<!-- ══════════ TELA DE LOGIN ══════════ -->
<div id="ac-login-overlay">
  <div class="ac-login-wrap">

<script>
'use strict';
// ════════════════════════════════════════════════════════════
// CRM Araújo & Castro — front-end
//
// Um arquivo, uma planilha. Diferente do ERP, este sistema ESCREVE:
// tudo que você faz aqui grava direto na "10 - CRM Leads".
// Nenhuma outra planilha do escritório é tocada — Financeiro,
// Processos e Parcelamentos continuam sendo lançados à mão.
//
// v2 — o que mudou:
//  · tela de login e cabeçalho iguais aos do ERP (mesmo tema)
//  · funil voltou ao formato do kanban do ERP (coluna por estágio,
//    com soma de valor no topo e botões de ação no cartão)
//  · aba Histórico removida — a linha do tempo continua na ficha,
//    que é onde ela é de fato usada
//  · ESCRITA OTIMISTA: a tela muda na hora e a planilha é atualizada
//    em segundo plano. Se o servidor recusar, a tela volta atrás e
//    avisa. Ver aplicarLocal() / gravar().
//  · reunião pode ir para o Google Agenda
// ════════════════════════════════════════════════════════════

var URL_KEY  = 'ac_crm_url';
var SESS_KEY = 'ac_crm_sess';
var USER_KEY = 'ac_crm_user';
var URL_PADRAO = 'https://script.google.com/macros/s/AKfycbwtZDjqY6HZY53KCdFcAhi8K0T9j-HBa3GnYP07o1M8Mo8PErYOcaVdyUyoPMggrAqXsw/exec';
// ^ implantacao do script da planilha 10 - CRM Leads. Se um dia voce
//   reimplantar e a URL mudar, troque aqui ou use "Configurar conexao".

var DB = { leads:[], reunioes:[], interacoes:[], listas:{}, estagios:[] };
var SESSAO = null;
var PENDENTES = 0;   // gravações ainda em voo

// Mesmos estágios e mesmas cores do kanban antigo do ERP.
var ESTAGIOS_PADRAO = ['Prospecção','Primeiro Contato','Reunião Agendada','Solicitar Docs',
                       'Proposta','Contrato Gerado','Contrato Assinado','Perdido'];
var CORES = {
  'Prospecção':'#2563EB','Primeiro Contato':'#0891B2','Reunião Agendada':'#7C3AED',
  'Solicitar Docs':'#0E7490','Proposta':'#D97706','Contrato Gerado':'#92400E',
  'Contrato Assinado':'#15803D','Perdido':'#4B5563'
};
// O ERP não punha "Contrato Assinado" nem "Perdido" no kanban: quem já
// decidiu não é mais funil. Eles continuam na aba "Todos os leads".
var FORA_DO_KANBAN = ['Contrato Assinado','Perdido'];
var ABERTOS = ESTAGIOS_PADRAO.filter(function(e){ return FORA_DO_KANBAN.indexOf(e)<0; });

// ── utilidades ──
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fBRL(n){ return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}); }
function estagios(){ return (DB.estagios&&DB.estagios.length)?DB.estagios:ESTAGIOS_PADRAO; }

// A URL do Apps Script tem formas parecidas e só uma funciona.
// Implantar como "Biblioteca" gera /macros/library/d/<id>/<versao>, que não
// atende requisição HTTP — devolve HTML e a leitura do JSON quebra.
function checarUrl(u){
  u = String(u||'').trim();
  if(!u) return 'Nenhuma URL configurada.';
  if(u.indexOf('script.google.com') < 0) return 'A URL precisa ser do script.google.com.';
  if(/\/macros\/library\/d\//.test(u))
    return 'Essa é a URL de BIBLIOTECA, não de aplicativo da web. Em Implantar › Nova implantação, '
         + 'clique na engrenagem "Selecionar tipo" e escolha "App da Web". A URL certa começa com '
         + 'https://script.google.com/macros/s/ e termina em /exec.';
  if(/\/macros\/d\//.test(u))
    return 'Essa é a URL do EDITOR do script, não da implantação. Vá em Implantar › Gerenciar '
         + 'implantações e copie a URL do aplicativo da web (termina em /exec).';
  if(u.indexOf('/macros/s/') < 0)
    return 'URL fora do padrão. A correta é https://script.google.com/macros/s/.../exec';
  if(!/\/(exec|dev)$/.test(u))
    return 'Falta o /exec no fim da URL. Copie-a inteira em Implantar › Gerenciar implantações.';
  return '';
}
function getUrl(){ return localStorage.getItem(URL_KEY) || URL_PADRAO; }

function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._x); t._x=setTimeout(function(){ t.classList.remove('show'); },3600); }
function status(cls,txt){ var s=$('stat'); s.className='st '+cls; s.textContent=txt; }
function fechar(id){ $(id).classList.remove('on'); }
function abrir(id){ $(id).classList.add('on'); }

// Data: dd/MM/yyyy ⇄ yyyy-MM-dd (o <input type=date> só fala ISO)
function paraISO(br){ var m=String(br||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? m[3]+'-'+m[2]+'-'+m[1] : ''; }
function paraBR(iso){ var m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3]+'/'+m[2]+'/'+m[1] : String(iso||''); }
function paraData(br){ var m=String(br||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? new Date(+m[3],+m[2]-1,+m[1]) : null; }
function hoje0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function hojeBR(){ var d=new Date(), z=function(n){return (n<10?'0':'')+n;};
  return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear(); }
function horaAgora(){ var d=new Date(), z=function(n){return (n<10?'0':'')+n;};
  return z(d.getHours())+':'+z(d.getMinutes()); }
function diasAte(br){ var d=paraData(br); if(!d) return null;
  return Math.round((d-hoje0())/86400000); }

// ── comunicação ──
async function chamar(qs){
  var url=getUrl();
  var problema=checarUrl(url);
  if(problema) throw new Error(problema);
  var res=await fetch(url+qs+(qs.indexOf('?')<0?'?':'&')+'_t='+Date.now(),{cache:'no-store'});
  var txt=await res.text();
  try { return JSON.parse(txt); }
  catch(e){
    console.error('[CRM] resposta não-JSON:',res.status,txt.slice(0,600));
    if(/accounts\.google\.com|Sign in|Faça login/i.test(txt))
      throw new Error('A implantação está restrita. Em Implantar › Gerenciar implantações, use "Qualquer pessoa".');
    if(/autoriza|authoriz|permission/i.test(txt))
      throw new Error('O script precisa ser autorizado. Abra o editor, rode diagnosticarCRM() e aceite.');
    throw new Error('O servidor respondeu HTTP '+res.status+' com uma página, não com dados.');
  }
}
function codificar(o){ return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(o))))); }

// ════════════════════════════════════════════════════════════
// ESCRITA OTIMISTA
//
// O jeito antigo era: gravar → esperar → recarregar a planilha inteira.
// Dava 3 a 6 segundos de tela parada por clique. Agora:
//   1. aplicarLocal() muda o DB da memória e redesenha — instantâneo;
//   2. a requisição sai em segundo plano;
//   3. se o servidor recusar (ou a rede cair), desfaz e avisa.
//
// A trava contra erro continua sendo do servidor: _conferirLinha()
// confere o nome antes de escrever. Aqui só antecipamos o desenho.
// ════════════════════════════════════════════════════════════
function _clonar(o){ return JSON.parse(JSON.stringify(o)); }

function gravarOtimista(acao, dados, mudanca, msgOk){
  if(!SESSAO){ toast('Sessão expirada.'); return; }
  var antes = { leads:_clonar(DB.leads), reunioes:_clonar(DB.reunioes), interacoes:_clonar(DB.interacoes) };
  try{ mudanca(); }catch(e){ console.error(e); }
  renderTudo();
  if(msgOk) toast(msgOk);

  PENDENTES++; status('load','salvando…');
  chamar('?_wb=1&payload='+codificar({acao:acao,login:SESSAO.login,dados:dados}))
    .then(function(j){
      if(j && j._negado){ throw new Error('Sem permissão para gravar.'); }
      if(!j || !j.ok){ throw new Error((j&&j.erro)||'A planilha recusou a alteração.'); }
      // O servidor devolve a linha real de um lead novo. Sem isso, o
      // cartão recém-criado ficaria sem endereço na planilha e o
      // próximo "Mover" iria para a linha errada.
      if(j.linha) _corrigirLinha(dados, j.linha);
      _fim(true);
    })
    .catch(function(e){
      DB.leads=antes.leads; DB.reunioes=antes.reunioes; DB.interacoes=antes.interacoes;
      renderTudo();
      toast('✗ Desfeito: '+e.message);
      _fim(false);
    });
}
function _fim(ok){
  PENDENTES--;
  if(PENDENTES<=0){ PENDENTES=0; status(ok?'ok':'err', ok?'salvo':'erro ao salvar'); }
}
function _corrigirLinha(dados, linha){
  var alvo = DB.leads.filter(function(l){ return l.linha<0 && l.nome===dados.nome; })[0];
  if(alvo){ alvo.linha = linha; renderTudo(); }
}
function acharLead(linha){ return DB.leads.filter(function(l){ return l.linha===linha; })[0]; }

function renderTudo(){
  preencherListas(); render(); renderLista(); renderReu(); renderKPIs(); renderAlertas();
}

// ── login ──
async function sha256(t){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');
}
function lgMsg(t,cls){
  var e=$('ac-login-msg');
  if(!t){ e.innerHTML=''; return; }
  e.innerHTML='<div class="'+(cls==='o'?'ac-login-msg-ok':'ac-login-msg-inner')+'">'+esc(t)+'</div>';
}
function alternarSenha(){
  var i=$('ac-login-senha'); i.type = i.type==='password' ? 'text' : 'password'; i.focus();
}
function alternarUrl(){
  var f=$('ac-login-url-field'), aberto=f.classList.contains('open');
  f.classList.toggle('open');
  $('ac-url-txt').textContent = aberto ? 'Configurar conexão' : 'Fechar configuração';
  if(!aberto){ $('ac-login-url-in').value=getUrl(); $('ac-login-url-in').focus(); }
}
function salvarUrlLogin(){
  var v=$('ac-login-url-in').value.trim();
  var problema=checarUrl(v);
  if(problema){ lgMsg(problema,'e'); return; }
  localStorage.setItem(URL_KEY,v);
  lgMsg('URL salva. Testando…','o');
  alternarUrl(); testarConexao();
}
async function testarConexao(){
  lgMsg('Testando…','o');
  try{
    var j=await chamar('?acao=ping');
    lgMsg('Conexão OK — '+(j.versao||'?')+' · leitura em lote: '+(j.lote?'ativa':'DESATIVADA')
      +(j.calendario?' · Google Agenda: ligado':''),'o');
  }catch(e){ lgMsg(e.message,'e'); }
}

async function entrar(){
  var u=$('ac-login-email').value.trim(), p=$('ac-login-senha').value;
  if(!u||!p){ lgMsg('Preencha login e senha.','e'); return; }
  var btn=$('ac-login-btn');
  btn.disabled=true; btn.innerHTML='<span class="ac-login-spin"></span> Verificando…';
  try{
    var j=await chamar('?_auth=1&payload='+codificar({acao:'autenticar',login:u}));
    if(!j.ok){ lgMsg(j.erro||'Login ou senha incorretos.','e'); return; }
    var h=await sha256(p);
    if(h!==j.usuario.senhaHash){ lgMsg('Login ou senha incorretos.','e'); $('ac-login-senha').value=''; return; }
    SESSAO={ login:u, nome:j.usuario.nome||u, ts:Date.now() };
    sessionStorage.setItem(SESS_KEY,JSON.stringify(SESSAO));
    if($('ac-lembrar').checked) localStorage.setItem(USER_KEY,u);
    else localStorage.removeItem(USER_KEY);
    lgMsg('');
    $('ac-login-overlay').classList.remove('open');
    $('hdUser').textContent='👤 '+SESSAO.nome;
    carregar();
  }catch(e){ lgMsg(e.message,'e'); }
  finally{ btn.disabled=false; btn.textContent='Entrar'; }
}

function sair(){
  sessionStorage.removeItem(SESS_KEY); SESSAO=null;
  DB={ leads:[], reunioes:[], interacoes:[], listas:{}, estagios:[] };
  $('ac-login-overlay').classList.add('open');
  $('ac-login-senha').value=''; lgMsg('');
}

// ── carga ──
async function carregar(){
  if(!SESSAO) return;
  status('load','Carregando…');
  try{
    var j=await chamar('?login='+encodeURIComponent(SESSAO.login));
    if(j._negado){ toast('✗ '+(j.erro||'Acesso negado.')); sair(); return; }
    if(!j.ok) throw new Error(j.erro||'Falha ao carregar.');
    DB=j;
    status('ok',(j._diag?j._diag.ms+'ms':'ok'));
    $('calInfo').textContent = j.calendario
      ? 'Google Agenda ligado — reuniões novas viram evento com lembrete.'
      : 'Google Agenda desligado no script (veja CAL_ATIVO em CRM_SCRIPT.gs).';
    renderTudo();
  }catch(e){ status('err','Erro'); toast('✗ '+e.message); }
}

function opcoes(sel, arr, vazio){
  var e=$(sel); if(!e) return;
  var atual=e.value;
  e.innerHTML=(vazio!==undefined?'<option value="">'+esc(vazio)+'</option>':'')
    + (arr||[]).map(function(v){ return '<option value="'+esc(v)+'">'+esc(v)+'</option>'; }).join('');
  if(atual) e.value=atual;
}
function preencherListas(){
  var L=DB.listas||{};
  var resps=Array.from(new Set(((L.responsavel||[]).concat(DB.leads.map(function(l){return l.responsavel;}))).filter(Boolean)));
  var nats =Array.from(new Set(((L.natureza||[]).concat(DB.leads.map(function(l){return l.natureza;}))).filter(Boolean)));

  opcoes('fResp',resps,'Responsável: todos');
  opcoes('fNat',nats,'Natureza: todas');
  opcoes('lEst',estagios(),'Estágio: todos');
  opcoes('f_natureza',nats,'—'); opcoes('f_responsavel',resps,'—');
  opcoes('f_origem',L.origem||[],'—'); opcoes('f_canal',L.canal||[],'—');
  opcoes('f_estagio',estagios());
  opcoes('m_estagio',estagios());
  opcoes('r_advogado',resps,'—');
  opcoes('r_lead',DB.leads.filter(function(l){ return l.estagio!=='Perdido'; })
    .map(function(l){ return l.nome; }),'—');
}

// ── filtros ──
function filtrados(){
  var r=($('fResp')||{}).value||'', n=($('fNat')||{}).value||'',
      b=(($('fBusca')||{}).value||'').toLowerCase().trim();
  return DB.leads.filter(function(l){
    if(r && l.responsavel!==r) return false;
    if(n && l.natureza!==n) return false;
    if(b && String(l.nome||'').toLowerCase().indexOf(b)<0 && String(l.doc||'').indexOf(b)<0) return false;
    return true;
  });
}

// ── KPIs ──
function renderKPIs(){
  var L=DB.leads;
  var abertos=L.filter(function(l){ return ABERTOS.indexOf(l.estagio)>=0; });
  var pipe=abertos.reduce(function(s,l){ return s+(Number(l.valor)||0); },0);
  var assinados=L.filter(function(l){ return l.estagio==='Contrato Assinado'; });
  var perdidos=L.filter(function(l){ return l.estagio==='Perdido'; });
  var decididos=assinados.length+perdidos.length;
  var conv=decididos? Math.round(assinados.length/decididos*100) : 0;
  var atrasados=abertos.filter(function(l){ var d=diasAte(l.proximo); return d!==null && d<0; });
  var semData=abertos.filter(function(l){ return !l.proximo; });

  $('kpis').innerHTML=
     kpi('Leads abertos',abertos.length,'de '+L.length+' no total')
   + kpi('Valor no funil',fBRL(pipe),'soma dos abertos')
   + kpi('Conversão',conv+'%',assinados.length+' ganhos · '+perdidos.length+' perdidos')
   + kpi('Contato atrasado',atrasados.length,'passou da data combinada',atrasados.length?'alerta':'')
   + kpi('Sem próximo contato',semData.length,'nenhuma data marcada',semData.length?'alerta':'');
}
function kpi(l,v,s,cls){
  return '<div class="kpi '+(cls||'')+'"><div class="kpi-l">'+esc(l)+'</div>'
       + '<div class="kpi-v">'+esc(v)+'</div><div class="kpi-s">'+esc(s||'')+'</div></div>';
}

// Alertas: o CRM só é útil se disser o que fazer hoje.
function renderAlertas(){
  var abertos=DB.leads.filter(function(l){ return ABERTOS.indexOf(l.estagio)>=0; });
  var atr=abertos.filter(function(l){ var d=diasAte(l.proximo); return d!==null && d<0; });
  var hj =abertos.filter(function(l){ return diasAte(l.proximo)===0; });
  var h='';
  if(hj.length)  h+='<div class="msg a"><span>📅</span><div><b>'+hj.length+'</b> contato(s) marcado(s) para hoje: '
    + hj.slice(0,4).map(function(l){ return esc(l.nome); }).join(', ')+(hj.length>4?' e mais…':'')+'</div></div>';
  if(atr.length) h+='<div class="msg e"><span>⚠</span><div><b>'+atr.length+'</b> lead(s) com contato atrasado: '
    + atr.slice(0,4).map(function(l){ return esc(l.nome)+' ('+Math.abs(diasAte(l.proximo))+'d)'; }).join(', ')
    + (atr.length>4?' e mais…':'')+'</div></div>';
  $('alertas').innerHTML=h;
}

// ── FUNIL (kanban do ERP) ──
function render(){
  var L=filtrados();
  var cols=estagios().filter(function(e){ return FORA_DO_KANBAN.indexOf(e)<0; });
  $('kb').innerHTML=cols.map(function(est){
    var itens=L.filter(function(l){ return l.estagio===est; });
    var soma=itens.reduce(function(s,l){ return s+(Number(l.valor)||0); },0);
    return '<div class="crm-col">'
      + '<div class="crm-col-hd">'
      +   '<span class="crm-col-dot" style="background:'+(CORES[est]||'#999')+'"></span>'
      +   '<span class="crm-col-nm">'+esc(est)+'</span>'
      +   '<span class="crm-col-cnt">'+itens.length+'</span></div>'
      + (soma>0 ? '<div class="crm-col-val">'+fBRL(soma)+'</div>' : '')
      + (itens.length ? itens.map(cardHtml).join('') : '<div class="crm-vazio">—</div>')
      + '</div>';

function cardHtml(l){
  var d=diasAte(l.proximo);
  var cls = (d!==null && d<0) ? ' atrasado' : (d===0 ? ' hoje' : '');
  var quando = l.proximo ? (d<0 ? '⚠ atrasado '+Math.abs(d)+'d' : d===0 ? '📅 hoje' : '📅 em '+d+'d') : 'sem data';
  return '<div class="crm-lead'+cls+'">'
    + '<div class="crm-card-btns">'
    +   (l.telefone ? '<button class="crm-card-btn" onclick="zap('+l.linha+')" title="WhatsApp">💬</button>' : '')
    +   (l.email ? '<button class="crm-card-btn" onclick="mail('+l.linha+')" title="E-mail">📧</button>' : '')
    +   '<button class="crm-card-btn" onclick="ficha('+l.linha+')" title="Histórico">📋</button>'
    + '</div>'
    + '<div class="crm-lead-nm" onclick="ficha('+l.linha+')">'+esc(l.nome)+'</div>'
    + '<div class="crm-lead-sub">'+esc(l.natureza||'—')+' · '+esc(l.responsavel||'—')+'</div>'
    + (l.valor ? '<div class="crm-lead-val">'+fBRL(l.valor)+'</div>' : '')
    + '<div class="crm-lead-dt'+cls+'">'+esc(quando)+'</div>'
    + '<div class="crm-acts">'
    +   '<button class="mini" onclick="abrirMover('+l.linha+')">Mover</button>'
    +   '<button class="mini" onclick="abrirInt('+l.linha+')">Contato</button>'
    +   '<button class="mini" onclick="editarLead('+l.linha+')">Editar</button>'
    + '</div></div>';
}

// ── novo / editar ──
var EDITANDO=null;
var CAMPOS=['nome','doc','telefone','email','natureza','responsavel','valor','origem',
            'indicadoPor','canal','proximo','estagio','obs'];
var _linhaTemp=-1;   // ids negativos para leads ainda sem linha na planilha

function novoLead(){
  EDITANDO=null;
  $('leadT').textContent='Novo lead'; $('leadMsg').innerHTML='';
  CAMPOS.forEach(function(c){ var e=$('f_'+c); if(e) e.value=''; });
  $('f_estagio').value='Prospecção';
  $('f_estagio').disabled=false;
  abrir('ovLead'); setTimeout(function(){ $('f_nome').focus(); },80);
}
function editarLead(linha){
  var l=acharLead(linha); if(!l) return;
  EDITANDO=l;
  $('leadT').textContent='Editar — '+l.nome; $('leadMsg').innerHTML='';
  CAMPOS.forEach(function(c){
    var e=$('f_'+c); if(!e) return;
    e.value = (c==='proximo') ? paraISO(l.proximo) : (l[c]==null?'':l[c]);
  });
  // Estágio só muda pelo fluxo próprio, que grava histórico e datas.
  $('f_estagio').value=l.estagio;
  $('f_estagio').disabled=true;
  abrir('ovLead'); setTimeout(function(){ $('f_nome').focus(); },80);
}

function salvarLead(){
  var d={};
  CAMPOS.forEach(function(c){ var e=$('f_'+c); if(e) d[c]=e.value; });
  if(!String(d.nome||'').trim()){ $('leadMsg').innerHTML='<div class="msg e"><div>Informe o nome.</div></div>'; return; }
  fechar('ovLead');

  if(EDITANDO){
    var alvo=EDITANDO;
    d.linha=alvo.linha; d.nomeEsperado=alvo.nome; delete d.estagio;
    gravarOtimista('atualizarLead', d, function(){
      var l=acharLead(alvo.linha); if(!l) return;
      CAMPOS.forEach(function(c){ if(c==='estagio') return;
        l[c] = (c==='valor') ? (Number(d[c])||0) : (c==='proximo' ? paraBR(d[c]) : d[c]); });
    }, '✓ Lead atualizado.');
  } else {
    var novo = {
      linha:_linhaTemp--, nome:d.nome, doc:d.doc, telefone:d.telefone, email:d.email,
      natureza:d.natureza, responsavel:d.responsavel || SESSAO.nome, valor:Number(d.valor)||0,
      origem:d.origem, indicadoPor:d.indicadoPor, canal:d.canal,
      proximo:paraBR(d.proximo), estagio:d.estagio||'Prospecção',
      obs:d.obs, entrada:hojeBR(), motivoPerda:''
    };
    gravarOtimista('criarLead', d, function(){
      DB.leads.push(novo);
      DB.interacoes.push({ linha:0, lead:novo.nome, data:hojeBR(), hora:horaAgora(),
        tipo:'Sistema', responsavel:SESSAO.nome, estagio:novo.estagio,
        resumo:'Lead cadastrado', proximaAcao:'' });
    }, '✓ Lead criado.');
  }
  EDITANDO=null;
}

// ── mover estágio ──
var MOVENDO=null;
function abrirMover(linha){
  var l=acharLead(linha); if(!l) return;
  MOVENDO=l;
  $('movMsg').innerHTML='';
  $('movLead').innerHTML='<b>'+esc(l.nome)+'</b> · hoje em <b>'+esc(l.estagio)+'</b>';
  $('m_estagio').value=proximoEstagio(l.estagio);
  $('m_resumo').value=''; $('m_proximo').value='';
  movMotivo(); abrir('ovMover');
}
function proximoEstagio(atual){
  var E=estagios(), i=E.indexOf(atual);
  return (i>=0 && i<E.length-2) ? E[i+1] : atual;
}
function movMotivo(){
  $('movMotivoBox').style.display = ($('m_estagio').value==='Perdido') ? '' : 'none';
}
function salvarMover(){
  if(!MOVENDO) return;
  var alvo=MOVENDO, novoEst=$('m_estagio').value;
  var motivo=(novoEst==='Perdido') ? $('m_motivo').value : '';
  var prox=$('m_proximo').value, resumo=$('m_resumo').value;
  fechar('ovMover');
  gravarOtimista('moverEstagio', {
    linha:alvo.linha, nomeEsperado:alvo.nome, estagio:novoEst,
    motivoPerda:motivo, proximo:prox, resumo:resumo, responsavel:SESSAO.nome
  }, function(){
    var l=acharLead(alvo.linha); if(!l) return;
    var de=l.estagio;
    l.estagio=novoEst;
    if(motivo) l.motivoPerda=motivo;
    if(prox) l.proximo=paraBR(prox);
    DB.interacoes.push({ linha:0, lead:l.nome, data:hojeBR(), hora:horaAgora(),
      tipo:'Sistema', responsavel:SESSAO.nome, estagio:novoEst,
      resumo:(resumo||('Estágio: '+de+' → '+novoEst)), proximaAcao:'' });
  }, '✓ '+alvo.nome+' → '+novoEst);
  MOVENDO=null;
}

// ── registrar contato ──
var INTERAGINDO=null;
function abrirInt(linha){
  var l=acharLead(linha); if(!l) return;
  INTERAGINDO=l;
  $('intMsg').innerHTML='';
  $('intLead').innerHTML='<b>'+esc(l.nome)+'</b> · '+esc(l.estagio);
  $('i_resumo').value=''; $('i_prox').value=''; $('i_proximo').value='';
  abrir('ovInt'); setTimeout(function(){ $('i_resumo').focus(); },80);
}
function salvarInt(){
  if(!INTERAGINDO) return;
  if(!$('i_resumo').value.trim()){
    $('intMsg').innerHTML='<div class="msg e"><div>Escreva o que aconteceu.</div></div>'; return; }
  var alvo=INTERAGINDO;
  var d={ lead:alvo.nome, linha:alvo.linha, estagio:alvo.estagio,
    tipo:$('i_tipo').value, resumo:$('i_resumo').value,
    proximaAcao:$('i_prox').value, proximo:$('i_proximo').value, responsavel:SESSAO.nome };
  fechar('ovInt');
  gravarOtimista('registrarInteracao', d, function(){
    DB.interacoes.push({ linha:0, lead:d.lead, data:hojeBR(), hora:horaAgora(),
      tipo:d.tipo, responsavel:d.responsavel, estagio:d.estagio,
      resumo:d.resumo, proximaAcao:d.proximaAcao });
    var l=acharLead(alvo.linha);
    if(l && d.proximo) l.proximo=paraBR(d.proximo);
  }, '✓ Contato registrado.');
  INTERAGINDO=null;
}

// ── reunião ──
function abrirReuniao(nomeEnc){
  $('reuMsg').innerHTML='';
  $('r_data').value=''; $('r_hora').value=''; $('r_link').value='';
  $('r_obs').value=''; $('r_email').value='';
  if(nomeEnc){
    var n=decodeURIComponent(nomeEnc);
    $('r_lead').value=n;
    var l=DB.leads.filter(function(x){ return x.nome===n; })[0];
    if(l && l.email) $('r_email').value=l.email;
  }
  abrir('ovReu');
}
function salvarReuniao(){
  var lead=$('r_lead').value, data=$('r_data').value;
  if(!lead || !data){
    $('reuMsg').innerHTML='<div class="msg e"><div>Escolha o lead e a data.</div></div>'; return; }
  var l=DB.leads.filter(function(x){ return x.nome===lead; })[0];
  var d={ lead:lead, linha:l?l.linha:'', data:data, hora:$('r_hora').value,
    duracao:Number($('r_dur').value)||60,
    modalidade:$('r_modalidade').value, advogado:$('r_advogado').value||SESSAO.nome,
    link:$('r_link').value, obs:$('r_obs').value, natureza:l?l.natureza:'',
    email:$('r_email').value, googleAgenda:$('r_gcal').checked };
  fechar('ovReu');
  gravarOtimista('agendarReuniao', d, function(){
    DB.reunioes.push({ linha:0, lead:d.lead, natureza:d.natureza, advogado:d.advogado,
      data:paraBR(d.data), hora:d.hora, modalidade:d.modalidade, link:d.link,
      status:'Agendada', resultado:'', obs:d.obs });
    var alvo=acharLead(d.linha);
    if(alvo){
      alvo.estagio='Reunião Agendada';
      alvo.proximo=paraBR(d.data);
      DB.interacoes.push({ linha:0, lead:alvo.nome, data:hojeBR(), hora:horaAgora(),
        tipo:'Reunião', responsavel:d.advogado, estagio:'Reunião Agendada',
        resumo:'Reunião marcada para '+paraBR(d.data)+(d.hora?' às '+d.hora:''),
        proximaAcao:'Realizar reunião' });
    }
  }, '✓ Reunião agendada.');
}

// WhatsApp já com a mensagem pronta — o contato ainda precisa ser
// registrado depois, para a linha do tempo não ficar com buraco.
function zap(linha){
  var l=acharLead(linha); if(!l||!l.telefone) return;
  var num=String(l.telefone).replace(/\D/g,'');
  if(num.length<=11) num='55'+num;
  var txt='Olá, '+String(l.nome).split(' ')[0]+'! Aqui é do escritório Araújo & Castro. ';
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(txt),'_blank');
  abrirInt(linha);
  $('i_tipo').value='WhatsApp';
}
function mail(linha){
  var l=acharLead(linha); if(!l||!l.email) return;
  window.open('mailto:'+encodeURIComponent(l.email)
    +'?subject='+encodeURIComponent('Araújo & Castro Advocacia'),'_blank');
  abrirInt(linha);
  $('i_tipo').value='E-mail';
}

// ── início ──
(function(){
  var logado=false;
  try{
    var s=sessionStorage.getItem(SESS_KEY);
    if(s){
      SESSAO=JSON.parse(s);
      $('hdUser').textContent='👤 '+SESSAO.nome;
      logado=true;
      carregar();
    }
  }catch(e){}
  if(!logado){
    $('ac-login-overlay').classList.add('open');
    var u=localStorage.getItem(USER_KEY);
    if(u){ $('ac-login-email').value=u; $('ac-lembrar').checked=true;
      setTimeout(function(){ $('ac-login-senha').focus(); },120); }
    else setTimeout(function(){ $('ac-login-email').focus(); },120);
    // Sem URL valida, nao adianta pedir senha: abre a configuracao de cara.
    if(checarUrl(getUrl())){
      alternarUrl();
      lgMsg('Configure a URL do Apps Script para começar.','e');
    }
  }
  document.querySelectorAll('.ov').forEach(function(o){
    o.addEventListener('click',function(e){ if(e.target===o) o.classList.remove('on'); });
  });
  // Fechar modal no Esc, como no ERP.
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') document.querySelectorAll('.ov.on').forEach(function(o){ o.classList.remove('on'); });
  });
  // Aviso se sair com gravação em voo.
  window.addEventListener('beforeunload',function(e){
    if(PENDENTES>0){ e.preventDefault(); e.returnValue=''; }
  });
})();
</script>
